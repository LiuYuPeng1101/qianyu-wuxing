<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>五行本命 · 纳音查询</title>
<style>
  :root{
    --ink:#141824;          /* 玄墨 */
    --ink-2:#1e2433;
    --paper:#f2ead8;        /* 宣纸 */
    --gold:#c9a86a;         /* 泥金 */
    --seal:#b03a2e;         /* 朱砂 */
    --dim:#8a8fa3;
    --c-jin:#d8b45a;
    --c-mu:#5aa06a;
    --c-shui:#4f86c6;
    --c-huo:#d05a4a;
    --c-tu:#b08850;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Noto Serif SC","Songti SC","STSong",serif;
    background:radial-gradient(120% 90% at 50% 0%, var(--ink-2) 0%, var(--ink) 60%);
    color:var(--paper);
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:0 22px 48px;
    overflow-x:hidden;
  }
  /* ───── 星点背景 ───── */
  .stars{position:fixed;inset:0;pointer-events:none;opacity:.5}
  .stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:var(--gold);animation:tw 4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:.7}}

  /* body 为 flex 纵向布局，禁止子区块被压缩变形 */
  header,.ring,.card,.result,footer{flex-shrink:0}

  .brand{margin-top:40px;z-index:1;flex-shrink:0}
  .brand img{width:104px;height:auto;display:block;filter:drop-shadow(0 2px 10px rgba(201,168,106,.25))}

  header{margin-top:26px;text-align:center;position:relative;z-index:1}
  .eyebrow{font-size:12px;letter-spacing:.6em;color:var(--gold);text-indent:.6em;margin-bottom:14px}
  h1{font-size:34px;font-weight:600;letter-spacing:.18em;text-indent:.18em}
  .sub{margin-top:10px;font-size:13px;color:var(--dim);letter-spacing:.15em}

  /* ───── 五行环 ───── */
  .ring{position:relative;width:264px;height:264px;margin:40px auto 0;z-index:1}
  .ring .orbit{position:absolute;inset:26px;border:1px solid rgba(201,168,106,.28);border-radius:50%}
  .ring .orbit::before{content:"";position:absolute;inset:14px;border:1px dashed rgba(201,168,106,.18);border-radius:50%}
  .ring-spin{position:absolute;inset:0}
  .node{
    position:absolute;left:50%;top:50%;
    width:52px;height:52px;margin:-26px 0 0 -26px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:600;
    background:var(--ink-2);border:1px solid rgba(201,168,106,.4);
    /* --a 为角度：先转到方位，平移到半径115px，再转回来保持文字竖直 */
    transform:rotate(var(--a)) translateY(-106px) rotate(calc(var(--a) * -1));
    transition:box-shadow .5s, background .5s, color .5s, border-color .5s;
  }
  .node.lit{color:#141824;font-weight:700}
  .ring .core{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:96px;height:96px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;letter-spacing:.3em;text-indent:.3em;color:var(--dim);
    border:1px solid rgba(201,168,106,.25);
    background:rgba(20,24,36,.6);
    text-align:center;line-height:1.6;
    transition:all .5s;
  }
  .ring .core.big{font-size:44px;letter-spacing:0;text-indent:0;font-weight:700}

  /* ───── 输入区 ───── */
  .card{
    width:100%;max-width:380px;margin-top:26px;z-index:1;
    background:rgba(242,234,216,.04);
    border:1px solid rgba(201,168,106,.25);
    border-radius:6px;padding:26px 22px 24px;
    backdrop-filter:blur(4px);
  }
  .field-row{display:flex;gap:12px}
  .field{flex:1}
  .field label{display:block;font-size:12px;color:var(--gold);letter-spacing:.25em;margin-bottom:8px}
  select{
    width:100%;appearance:none;-webkit-appearance:none;
    background:var(--ink-2) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%23c9a86a"/></svg>') no-repeat right 12px center;
    border:1px solid rgba(201,168,106,.35);border-radius:4px;
    color:var(--paper);font-family:inherit;font-size:17px;
    padding:12px 32px 12px 14px;letter-spacing:.05em;
  }
  select:focus{outline:2px solid var(--gold);outline-offset:1px}
  .btn{
    width:100%;margin-top:20px;padding:15px 0;
    font-family:inherit;font-size:17px;font-weight:600;letter-spacing:.5em;text-indent:.5em;
    color:#141824;background:linear-gradient(160deg,#e3c98d,var(--gold));
    border:none;border-radius:4px;cursor:pointer;
    transition:transform .15s, filter .15s;
  }
  .btn:active{transform:scale(.97);filter:brightness(.92)}
  .hint{margin-top:12px;font-size:11px;color:var(--dim);text-align:center;letter-spacing:.08em;line-height:1.7}

  /* ───── 结果区 ───── */
  .result{width:100%;max-width:380px;margin-top:36px;z-index:1;display:none;text-align:center}
  .result.show{display:block;animation:rise .7s cubic-bezier(.2,.8,.3,1)}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  .ganzhi{font-size:14px;color:var(--dim);letter-spacing:.3em;text-indent:.3em}
  .seal{
    width:132px;height:132px;margin:18px auto;
    display:flex;align-items:center;justify-content:center;
    font-size:64px;font-weight:700;color:#fff;
    border-radius:10px;position:relative;
    box-shadow:0 8px 40px -6px rgba(0,0,0,.6);
    animation:stamp .5s .25s cubic-bezier(.3,1.6,.5,1) backwards;
  }
  @keyframes stamp{from{opacity:0;transform:scale(1.7) rotate(-8deg)}to{opacity:1;transform:scale(1) rotate(-3deg)}}
  .seal::after{content:"";position:absolute;inset:7px;border:2px solid rgba(255,255,255,.55);border-radius:6px}
  .nayin{font-size:22px;letter-spacing:.2em;text-indent:.2em;color:var(--gold);margin-top:4px}
  .desc{margin-top:14px;font-size:14px;line-height:2;color:rgba(242,234,216,.82);letter-spacing:.06em;text-align:justify}
  .again{margin-top:22px;background:none;border:1px solid rgba(201,168,106,.4);color:var(--gold);
    padding:10px 34px;font-family:inherit;font-size:14px;letter-spacing:.3em;text-indent:.3em;border-radius:4px;cursor:pointer}

  footer{margin-top:auto;padding-top:44px;font-size:11px;color:rgba(138,143,163,.55);letter-spacing:.15em;z-index:1;text-align:center;line-height:2.2}
  .brand-line{color:var(--gold);font-size:12px;letter-spacing:.25em}

  @media (prefers-reduced-motion: reduce){
    .stars i{animation:none}
  }
</style>
</head>

    "水":{color:"#38699e", light:"#4f86c6", desc:"水主智，性聪而形柔。水命之人多机敏灵慧，善察时势，随方就圆，遇阻能绕；宜守其定力，则百川归海，智周万物。"},
    "火":{color:"#a8402f", light:"#d05a4a", desc:"火主礼，性急而情热。火命之人多光明磊落，热忱待人，敢作敢当，如炬照夜；宜敛其躁气，则薪火绵长，暖而不灼。"},
    "土":{color:"#8a6a3a", light:"#b08850", desc:"土主信，性重而气厚。土命之人多敦厚笃实，任重能容，言出必践，如大地载物；宜化其迟滞，则厚德育人，万物所依。"}
  };

  // 五行环节点
  var order = ["木","火","土","金","水"];
  var spin = document.getElementById("ringSpin");
  var nodes = {};
  order.forEach(function(e,i){
    var d = document.createElement("div");
    d.className = "node";
    d.style.setProperty("--a", (i*72) + "deg"); // 木在正上方，顺时针每72°一个
    d.textContent = e;
    spin.appendChild(d);
    nodes[e] = d;
  });

  // 星点
  var stars = document.getElementById("stars");
  for(var i=0;i<40;i++){
    var s = document.createElement("i");
    s.style.left = Math.random()*100+"%";
    s.style.top = Math.random()*100+"%";
    s.style.animationDelay = (Math.random()*4)+"s";
    stars.appendChild(s);
  }

  // 下拉选项
  var ySel = document.getElementById("year"), mSel = document.getElementById("month");
  var now = new Date().getFullYear();
  for(var y=now; y>=1920; y--){
    var o = document.createElement("option");
    o.value = y; o.textContent = y+" 年";
    ySel.appendChild(o);
  }
  ySel.value = 1990;
  for(var m=1;m<=12;m++){
    var o2 = document.createElement("option");
    o2.value = m; o2.textContent = m+" 月";
    mSel.appendChild(o2);
  }

  function calc(year, month){
    // 年命以立春（约2月4日）为界；只有年月时，1月归上一年，2月起归本年
    var ly = (month <= 1) ? year - 1 : year;
    var idx = ((ly - 4) % 60 + 60) % 60;     // 0 = 甲子
    var stem = STEMS[idx % 10];
    var branch = BRANCHES[idx % 12];
    var zodiac = ZODIAC[idx % 12];
    var pair = NAYIN[Math.floor(idx/2)];
    return {ly:ly, gz:stem+branch, zodiac:zodiac, nayin:pair[0], elem:pair[1]};
  }

  var core = document.getElementById("core");
  var result = document.getElementById("result");
  var card = document.getElementById("card");

  document.getElementById("go").addEventListener("click", function(){
    var r = calc(+ySel.value, +mSel.value);
    var e = ELEM[r.elem];

    // 环高亮
    order.forEach(function(k){
      var n = nodes[k];
      n.classList.remove("lit");
      n.style.background = ""; n.style.boxShadow = ""; n.style.borderColor = "";
    });
    var lit = nodes[r.elem];
    lit.classList.add("lit");
    lit.style.background = e.light;
    lit.style.borderColor = e.light;
    lit.style.boxShadow = "0 0 26px "+e.light;

    core.classList.add("big");
    core.style.color = e.light;
    core.style.borderColor = e.light;
    core.textContent = r.elem;

    // 结果
    document.getElementById("ganzhi").textContent =
      r.ly + " · " + r.gz + "年 · 属" + r.zodiac;
    var seal = document.getElementById("seal");
    seal.textContent = r.elem;
    seal.style.background = "linear-gradient(150deg,"+e.light+","+e.color+")";
    seal.style.animation = "none"; void seal.offsetWidth;
    seal.style.animation = "";
    document.getElementById("nayin").textContent = "纳音「" + r.nayin + "」· " + r.elem + "命";
    document.getElementById("desc").textContent = e.desc;

    card.style.display = "none";
    result.classList.add("show");
    result.scrollIntoView({behavior:"smooth", block:"center"});
  });

  document.getElementById("again").addEventListener("click", function(){
    result.classList.remove("show");
    card.style.display = "";
    core.classList.remove("big");
    core.style.color = ""; core.style.borderColor = "";
    core.innerHTML = "静候<br>问命";
    order.forEach(function(k){
      var n = nodes[k];
      n.classList.remove("lit");
      n.style.background = ""; n.style.boxShadow = ""; n.style.borderColor = "";
    });
    window.scrollTo({top:0, behavior:"smooth"});
  });
})();
</script>
</body>
</html>
